<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.jpg" type="image/jpeg">
    <title>CHRONO INVESTOR : OVERDRIVE</title>

<style>
/* ★ ここはあなたの元CSSをそのまま貼り付けてください（変更なし） */
</style>

</head>

<body>

<div id="fever-overlay">
    <div class="fever-text">OVERDRIVE</div>
</div>

<div id="start-screen">
    <div class="menu-box">
        <div class="menu-logo">CHRONO INVESTOR</div>
        <div class="menu-sub">SELECT MODE</div>

        <div class="mode-list">
            <button class="btn-mode" onclick="startGame(1)">1 MIN</button>
            <button class="btn-mode" onclick="startGame(3)">3 MIN</button>
            <button class="btn-mode" onclick="startGame(5)">5 MIN</button>
            <button class="btn-mode" onclick="startGame(10)">10 MIN</button>
        </div>
    </div>
</div>

<div id="game-container" style="display:none;">
    <header>
        <div class="brand" id="game-brand">CHRONO INVESTOR</div>
        <div id="display-cash">1000</div>
        <div id="display-timer">00:00</div>
    </header>

    <div id="news-bar">SYSTEM</div>

    <!-- ===== マーケット ===== -->
    <div class="market-board">

        <div>🍎 りんご <span id="price-apple"></span> <span id="hold-apple"></span>
            <button onclick="trade('apple','buy')">BUY</button>
            <button onclick="trade('apple','sell')">SELL</button>
        </div>

        <div>👟 スニーカー <span id="price-shoes"></span> <span id="hold-shoes"></span>
            <button onclick="trade('shoes','buy')">BUY</button>
            <button onclick="trade('shoes','sell')">SELL</button>
        </div>

        <div>💎 宝石 <span id="price-jewel"></span> <span id="hold-jewel"></span>
            <button onclick="trade('jewel','buy')">BUY</button>
            <button onclick="trade('jewel','sell')">SELL</button>
        </div>

    </div>
</div>

<script>
// ==========================
// GAME STATE
// ==========================
let game = {
    cash: 1000,
    timeLeft: 180,
    autoPPS: 0,
    isOver: false,

    items: {
        apple: { price:100, lastPrice:100, min:20, max:400, hold:0, holdTime:0, range:0.06 },
        shoes: { price:300, lastPrice:300, min:60, max:1200, hold:0, holdTime:0, range:0.14 },
        jewel: { price:1000, lastPrice:1000, min:200, max:8000, hold:0, holdTime:0, range:0.35 }
    }
};

let timer = null;

// ==========================
// 保持ボーナス
// ==========================
function getHoldBonus(item){
    if(item.holdTime >= 10) return 2.0;
    if(item.holdTime >= 5) return 1.5;
    return 1.0;
}

// ==========================
// START
// ==========================
function startGame(min){
    game.timeLeft = min * 60;
    document.getElementById("start-screen").style.display="none";
    document.getElementById("game-container").style.display="block";

    timer = setInterval(tick,1000);
    updateUI();
}

// ==========================
// TRADE
// ==========================
function trade(key,type){
    let item = game.items[key];

    if(type === "buy"){
        if(game.cash >= item.price){
            let c = Math.floor(game.cash / item.price);
            game.cash -= c * item.price;
            item.hold += c;
            item.holdTime = 0;
        }
    }

    if(type === "sell"){
        if(item.hold > 0){
            let bonus = getHoldBonus(item);
            game.cash += item.hold * item.price * bonus;
            item.hold = 0;
            item.holdTime = 0;
        }
    }

    updateUI();
}

// ==========================
// TICK
// ==========================
function tick(){
    game.cash += game.autoPPS;
    game.timeLeft--;

    // 保持時間加算
    for(let k in game.items){
        let it = game.items[k];
        if(it.hold > 0) it.holdTime++;
        else it.holdTime = 0;
    }

    // 終了
    if(game.timeLeft <= 0){
        clearInterval(timer);
        return endGame();
    }

    // ==========================
    // 商品性格つき価格変動
    // ==========================
    for(let k in game.items){
        let it = game.items[k];

        let d = (Math.random()-0.5) * it.range;

        // 性格差
        if(k==="apple") d *= 0.7;
        if(k==="shoes") d *= 1.0;
        if(k==="jewel") d *= 2.2;

        it.lastPrice = it.price;
        it.price = Math.max(it.min, Math.min(it.max,
            Math.round(it.price * (1 + d))
        ));
    }

    updateUI();
}

// ==========================
// UI
// ==========================
function updateUI(){
    document.getElementById("display-cash").innerText = game.cash;

    for(let k in game.items){
        let it = game.items[k];
        document.getElementById("price-"+k).innerText = it.price;
        document.getElementById("hold-"+k).innerText = it.hold;
    }

    document.getElementById("display-timer").innerText =
        Math.floor(game.timeLeft/60)+":"+String(game.timeLeft%60).padStart(2,"0");
}

// ==========================
// END
// ==========================
function endGame(){
    game.isOver = true;

    let total = game.cash;

    for(let k in game.items){
        total += game.items[k].hold * game.items[k].price;
    }

    alert("終了: " + total);
}
</script>

</body>
</html>
